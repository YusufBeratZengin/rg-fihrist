[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rg-fihrist"
version = "0.2.0"
description = "CLI that turns the daily index (fihrist) of Turkey's Resmi Gazete (Official Gazette) into structured JSON/RSS with Turkish-aware keyword filtering."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YusufBeratZengin" }]
keywords = ["turkey", "official-gazette", "resmi-gazete", "legaltech", "rss", "open-data", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities",
]
# Zero runtime dependencies: only the Python standard library is used
# (urllib for HTTP, html.parser for parsing, xml.etree for RSS).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "mypy>=1.8"]

[project.scripts]
rg-fihrist = "rg_fihrist.cli:main"

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/rg-fihrist"
Repository = "https://github.com/YusufBeratZengin/rg-fihrist"
Issues = "https://github.com/YusufBeratZengin/rg-fihrist/issues"
Changelog = "https://github.com/YusufBeratZengin/rg-fihrist/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/rg_fihrist"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["rg_fihrist", "tests"]

[tool.mypy]
mypy_path = ["src", "."]
files = ["src", "tests"]
python_version = "3.10"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true
namespace_packages = true
explicit_package_bases = true
